limit_req_zone $binary_remote_addr zone=policy_push:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=policy_admin:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name xw.wyhn.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://xw.wyhn.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xw.wyhn.cc;

    ssl_certificate /etc/letsencrypt/live/xw.wyhn.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xw.wyhn.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /api/push/subscribe {
        limit_req zone=policy_push burst=5 nodelay;
        proxy_pass http://127.0.0.1:5191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/ {
        limit_req zone=policy_admin burst=6 nodelay;
        proxy_pass http://127.0.0.1:5191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
