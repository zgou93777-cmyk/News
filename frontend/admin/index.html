<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#202522">
    <title>系统管理 · 政知镜</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="admin.css?v=20260727-4">
    <script defer src="../assets/lucide-0.468.0.min.js?v=2"></script>
    <script defer src="admin.js?v=20260727-2"></script>
  </head>
  <body>
    <header class="admin-header">
      <div class="admin-width header-inner">
        <a class="admin-brand" href="../#/" aria-label="返回政知镜首页">
          <span class="brand-mark">政</span>
          <span><strong>政知镜</strong><small>系统管理</small></span>
        </a>
        <div class="header-actions">
          <a class="icon-button" href="../#/" title="返回网站" aria-label="返回网站">
            <i data-lucide="external-link" aria-hidden="true"></i>
          </a>
          <button class="icon-button" id="logout-button" type="button" title="退出管理" aria-label="退出管理" hidden>
            <i data-lucide="log-out" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <section class="login-section admin-width" id="login-section">
        <form class="login-panel" id="login-form">
          <div class="section-icon" aria-hidden="true"><i data-lucide="shield-check"></i></div>
          <p class="eyebrow">受保护区域</p>
          <h1>系统管理后台</h1>
          <label for="admin-token">管理口令</label>
          <div class="secret-input">
            <input id="admin-token" name="adminToken" type="password" autocomplete="current-password" required>
            <button class="input-icon" type="button" data-toggle-secret="admin-token" title="显示或隐藏口令" aria-label="显示或隐藏口令">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </div>
          <button class="primary-button full-button" type="submit">
            <i data-lucide="log-in" aria-hidden="true"></i><span>进入后台</span>
          </button>
          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <div class="admin-workspace" id="admin-workspace" hidden>
        <section class="workspace-heading admin-width">
          <div>
            <p class="eyebrow">历史政策流水线</p>
            <h1>自动处理进度</h1>
          </div>
          <div class="progress-actions">
            <span class="live-status" id="progress-live-status">正在读取</span>
            <button class="secondary-button compact-button" id="refresh-progress" type="button">
              <i data-lucide="refresh-cw" aria-hidden="true"></i><span>刷新</span>
            </button>
          </div>
        </section>

        <section class="progress-overview">
          <div class="admin-width metric-grid" id="progress-metrics">
            <button type="button" data-progress-group="discovered"><span>已发现</span><strong id="metric-discovered">--</strong><small>政策条目</small></button>
            <button type="button" data-progress-group="fetched" class="is-active"><span>已抓取</span><strong id="metric-fetched">--</strong><small>原文入库</small></button>
            <button type="button" data-progress-group="analyzed"><span>已分析</span><strong id="metric-analyzed">--</strong><small>形成判断</small></button>
            <button type="button" data-progress-group="verified"><span>已核对</span><strong id="metric-verified">--</strong><small>来源与周期</small></button>
            <button type="button" data-progress-group="ready"><span>预发布</span><strong id="metric-ready">--</strong><small>通过门槛</small></button>
            <button type="button" data-progress-group="published"><span>已发布</span><strong id="metric-published">--</strong><small>网站可见</small></button>
          </div>
        </section>

        <section class="pipeline-band">
          <div class="admin-width pipeline-grid">
            <div><span>队列总量</span><strong id="queue-total">--</strong></div>
            <div><span>近 24 小时处理</span><strong id="updated-last-24h">--</strong></div>
            <div><span>人工复核</span><strong id="manual-review-count">--</strong></div>
            <div><span>失败 / 待重试</span><strong id="retry-count">--</strong></div>
            <div><span>发布门禁</span><strong id="rollout-status">--</strong></div>
            <div><span>覆盖年份</span><strong id="coverage-years">--</strong></div>
          </div>
        </section>

        <section class="progress-section admin-width" aria-labelledby="progress-list-title">
          <div class="progress-heading">
            <div>
              <p class="eyebrow" id="progress-list-eyebrow">已抓取</p>
              <h2 id="progress-list-title">政策处理清单</h2>
            </div>
            <form class="progress-search" id="progress-search-form" role="search">
              <label class="sr-only" for="progress-search">搜索政策</label>
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="progress-search" type="search" maxlength="100" placeholder="标题、来源或原文链接">
              <button class="icon-button light-icon-button" type="submit" title="搜索" aria-label="搜索">
                <i data-lucide="arrow-right" aria-hidden="true"></i>
              </button>
            </form>
          </div>
          <div class="progress-table-wrap">
            <table class="progress-table">
              <thead><tr><th>政策</th><th>当前状态</th><th>分析结果</th><th>最近处理</th></tr></thead>
              <tbody id="progress-list"></tbody>
            </table>
            <div class="empty-state" id="progress-empty" hidden>
              <i data-lucide="inbox" aria-hidden="true"></i>
              <strong>当前阶段还没有政策</strong>
            </div>
          </div>
          <div class="progress-footer">
            <span id="progress-range">--</span>
            <div class="pagination-actions">
              <button class="icon-button light-icon-button" id="previous-page" type="button" title="上一页" aria-label="上一页"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
              <span id="progress-page">--</span>
              <button class="icon-button light-icon-button" id="next-page" type="button" title="下一页" aria-label="下一页"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            </div>
          </div>
        </section>

        <section class="workspace-heading model-heading admin-width">
          <div>
            <p class="eyebrow">模型服务</p>
            <h1>OpenAI 兼容接口</h1>
          </div>
          <div class="configuration-status" id="configuration-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="configuration-status-text">读取配置中</span>
          </div>
        </section>

        <section class="status-band">
          <div class="admin-width status-grid">
            <div><span>配置来源</span><strong id="config-source">--</strong></div>
            <div><span>密钥状态</span><strong id="key-status">--</strong></div>
            <div><span>最后更新</span><strong id="updated-at">--</strong></div>
          </div>
        </section>

        <section class="config-section admin-width">
          <form id="model-config-form">
            <div class="form-heading">
              <div>
                <h2>连接参数</h2>
                <p id="endpoint-preview">等待填写接口地址</p>
              </div>
              <i data-lucide="waypoints" aria-hidden="true"></i>
            </div>

            <div class="field-grid">
              <div class="field wide-field">
                <label for="model-base-url">中转站接口地址</label>
                <input id="model-base-url" name="baseUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/v1" required>
              </div>
              <div class="field">
                <label for="model-name">模型名称</label>
                <input id="model-name" name="modelName" type="text" autocomplete="off" spellcheck="false" placeholder="gpt-5" required>
              </div>
              <div class="field">
                <label for="model-api-key">API Key</label>
                <div class="secret-input">
                  <input id="model-api-key" name="apiKey" type="password" autocomplete="new-password" spellcheck="false" placeholder="留空则保持当前密钥">
                  <button class="input-icon" type="button" data-toggle-secret="model-api-key" title="显示或隐藏密钥" aria-label="显示或隐藏密钥">
                    <i data-lucide="eye" aria-hidden="true"></i>
                  </button>
                </div>
                <small id="api-key-note">尚未读取密钥状态</small>
              </div>
            </div>

            <div class="form-actions">
              <button class="secondary-button" id="test-button" type="button">
                <i data-lucide="plug-zap" aria-hidden="true"></i><span>测试连接</span>
              </button>
              <button class="primary-button" id="save-button" type="submit">
                <i data-lucide="save" aria-hidden="true"></i><span>保存并启用</span>
              </button>
            </div>
          </form>
        </section>

        <section class="result-section admin-width" aria-labelledby="test-result-title">
          <div class="result-heading">
            <div>
              <p class="eyebrow">连接检测</p>
              <h2 id="test-result-title">最近一次结果</h2>
            </div>
            <span class="result-badge is-idle" id="result-badge">尚未测试</span>
          </div>
          <div class="result-content" id="result-content">
            <i data-lucide="activity" aria-hidden="true"></i>
            <div>
              <strong id="result-message">等待连接测试</strong>
              <p id="result-details">--</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
